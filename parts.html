<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали - Склад деталей ПК</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Складской учет деталей для ПК</h1>
        <nav id="nav"></nav>
    </header>
    
    <main>
        <section class="card">
            <h2>Детали ПК</h2>
            <div class="toolbar admin-only" style="display:none">
                <button id="add-btn">Добавить деталь</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Артикул</th>
                        <th>Категория</th>
                        <th>Поставщик</th>
                        <th>Цена</th>
                        <th>Остаток</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="parts-tbody"></tbody>
            </table>
        </section>
        
        <dialog id="form-dialog">
            <form id="part-form">
                <h3 id="form-title">Новая деталь</h3>
                <input type="hidden" id="part-id">
                
                <label>
                    Название:
                    <input type="text" id="part-name" required maxlength="128">
                </label>
                
                <label>
                    Артикул:
                    <input type="text" id="part-number" required maxlength="64">
                </label>
                
                <label>
                    Категория:
                    <select id="category-id">
                        <option value="">—</option>
                    </select>
                </label>
                
                <label>
                    Поставщик:
                    <select id="supplier-id">
                        <option value="">—</option>
                    </select>
                </label>
                
                <label>
                    Закупочная цена:
                    <input type="number" id="purchase-price" min="0" step="0.01" value="0">
                </label>
                
                <label>
                    Описание:
                    <textarea id="description" rows="3"></textarea>
                </label>
                
                <p id="form-msg" class="error"></p>
                
                <div class="toolbar">
                    <button type="submit">Сохранить</button>
                    <button type="button" id="cancel-btn">Отмена</button>
                </div>
            </form>
        </dialog>
    </main>

</body>
</html>
