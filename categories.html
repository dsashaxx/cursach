<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории - Склад деталей ПК</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Складской учет деталей для ПК</h1>
        <nav id="nav"></nav>
    </header>
    
    <main>
        <section class="card">
            <h2>Категории</h2>
            <div class="toolbar admin-only" style="display:none">
                <button id="add-btn">Добавить категорию</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Описание</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="categories-tbody"></tbody>
            </table>
        </section>
        
        <dialog id="form-dialog">
            <form id="category-form">
                <h3 id="form-title">Новая категория</h3>
                <input type="hidden" id="category-id">
                
                <label>
                    Название:
                    <input type="text" id="category-name" required maxlength="80">
                </label>
                
                <label>
                    Описание:
                    <textarea id="category-description" rows="3"></textarea>
                </label>
                
                <p id="form-msg" class="error"></p>
                
                <div class="toolbar">
                    <button type="submit">Сохранить</button>
                    <button type="button" id="cancel-btn">Отмена</button>
                </div>
            </form>
        </dialog>
    </main>
</body>
</html>
